
site_name: Incendium Reignited Wiki
site_description: Temporary wiki for the Incedium Reignited update
site_url: https://stardust-labs-mc.github.io/incendium-wiki/

repo_url: https://github.com/Stardust-Labs-MC/Incendium
repo_name: Stardust-Labs-MC/Incendium

edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/incendium_symbol.png
  features:
    - navigation.instant
    - navigation.top
    - toc.integrate
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips

  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md

