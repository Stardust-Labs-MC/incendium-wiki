
site_name: Incendium Reignited Wiki
site_description: Temporary wiki for the Incedium Reignited update
site_url: https://stardust-labs-mc.github.io/incendium-wiki/

repo_url: https://github.com/Stardust-Labs-MC/Incendium
repo_name: Stardust-Labs-MC/Incendium

edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/incendium_symbol.png
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips

  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Biomes: 
      - biomes/index.md
      - Ash Barrens: biomes/ash-barrens.md
      - Quartz Flats: biomes/quartz-flats.md
      - Infernal Dunes: biomes/infernal-dunes.md
      - Toxic Heaps: biomes/toxic-heap.md
      - Voltaic Heaps: biomes/voltaic-heap.md
      - Withered Forest: biomes/withered-forest.md
      - Magma Marsh: biomes/magma-marsh.md
      
  - Structures:
      - structures/index.md
      - Forbidden Castle: structures/forbidden-castle.md
      - Sanctum: structures/sanctum.md
      - Infernal Altar: structures/infernal-altar.md
      - Ruined Lab: structures/ruined-lab.md
      - Voltaic Pylon: structures/voltaic-pylon.md
      - Nether Reactor: structures/nether-reactor.md
      - Pipeline: structures/quartz-kitchen.md
      - Piglin Village: structures/piglin-village.md
  - Items:
      - items/index.md
      - Greatsword of Sacrifice: items/greatsword-of-sacrifice.md
      - Scarlet Rapier: items/scarlet-rapier.md
      - Permafrost Pike: items/permafrost-pike.md
      - Daybreaker: items/daybreaker.md
      - Warping Witherblade: items/warping-witherblade.md
      - Blazing Hatchet: items/blazing-hatchet.md
  - Mobs:
      - mobs/index.md
      - Castle Knight: mobs/castle-knight.md
  - Bosses:
      - bosses/index.md
      - Hovering Inferno: bosses/hovering-inferno.md
      - Warped Wither: bosses/warped-wither.md
