
site_name: Incendium Reignited Wiki
site_description: Temporary wiki for the Incedium Reignited update
site_url: https://stardust-labs-mc.github.io/incendium-wiki/

repo_url: https://github.com/Stardust-Labs-MC/Incendium
repo_name: Stardust-Labs-MC/Incendium

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Biomes:
      - Infernal Dunes: biomes/infernal-dunes.md
  - Structures:
      - Sanctum: structures/sanctum.md
  - Items:
      - Greatsword of Sacrifice: items/greatsword-of-sacrifice.md
  - Mobs:
      - Castle Knight: mobs/castle-knight.md